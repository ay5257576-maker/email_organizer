<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – AI Email Organizer</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      margin: 0;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 2rem 2.25rem;
      box-shadow: var(--shadow);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-logo .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .auth-logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .auth-logo p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .tab.active {
      background: var(--primary);
      color: white;
    }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      font-size: 0.95rem;
    }
    .auth-error {
      background: rgba(231, 76, 60, 0.15);
      color: var(--danger);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <span class="icon">✉</span>
      <h1>AI Email Organizer</h1>
      <p>Final Year Project – Summarize & Organize</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login">Login</button>
      <button class="tab" id="tab-register">Register</button>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <!-- Login form -->
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary auth-btn">Login</button>
    </form>

    <!-- Register form (hidden by default) -->
    <form id="register-form" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your name" required minlength="2" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
    </form>
</div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem("token")) {
      window.location.href = "/";
    }

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const errorEl = document.getElementById("auth-error");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginForm.style.display = "block";
      registerForm.style.display = "none";
      errorEl.style.display = "none";
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerForm.style.display = "block";
      loginForm.style.display = "none";
      errorEl.style.display = "none";
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    function saveSession(data) {
      localStorage.setItem("token", data.access_token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = "/";
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value.trim(),
            password: document.getElementById("login-password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        saveSession(data);
      } catch (err) {
        showError(err.message);
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name: document.getElementById("reg-name").value.trim(),
            email: document.getElementById("reg-email").value.trim(),
            password: document.getElementById("reg-password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Registration failed");
        saveSession(data);
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
